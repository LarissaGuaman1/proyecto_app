name: proyecto
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  lottie: ^2.3.2
  firebase_core: ^3.15.2
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.4.5
  image_picker: ^0.8.7+6
  file_picker: ^8.0.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/default_avatar.png
    - assets/lottie/success.json
    - assets/disenos/
